server:
  port: 8080

spring:
  application:
    name: blog-service
  profiles:
    active: dev
  main:
    allow-circular-references: true
  datasource:
    driver-class-name: ${blog.datasource.driver-class-name}
    url: jdbc:mysql://${blog.datasource.host}:${blog.datasource.port}/${blog.datasource.database}?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: ${blog.datasource.username}
    password: ${blog.datasource.password}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      max-lifetime: 1800000
      pool-name: BlogHikariPool


mybatis:
  #mapper????
  mapper-locations: classpath:com/jxcia/blog/mapper/*.xml
  type-aliases-package: com.sky.entity
  configuration:
    #??????
    map-underscore-to-camel-case: true

logging:
  level:
    com:
      sky:
        mapper: debug
        service: info
        controller: info